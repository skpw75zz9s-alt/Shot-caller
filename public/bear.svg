<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4d6d" stop-opacity=".38"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".06"/></linearGradient>
  </defs>
  <g stroke="#ff4d6d" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)">
    <!-- ears -->
    <circle cx="16" cy="15" r="7.5" fill="url(#fill)"/><circle cx="48" cy="15" r="7.5" fill="url(#fill)"/>
    <circle cx="16" cy="15" r="3" fill="none"/><circle cx="48" cy="15" r="3" fill="none"/>
    <!-- head -->
    <path d="M32 11 C46 11 55 21 55 33 C55 46 45 55 32 55 C19 55 9 46 9 33 C9 21 18 11 32 11 Z" fill="url(#fill)"/>
    <!-- scowl and eyes -->
    <path d="M19 25 L27 29" fill="none"/><path d="M45 25 L37 29" fill="none"/>
    <circle cx="23" cy="31.5" r="1.8" fill="#ff4d6d"/><circle cx="41" cy="31.5" r="1.8" fill="#ff4d6d"/>
    <!-- muzzle, nose, mouth -->
    <ellipse cx="32" cy="43" rx="10.5" ry="8" fill="#05070d"/>
    <path d="M27.5 38.5 L36.5 38.5 L32 43 Z" fill="#ff4d6d"/>
    <path d="M32 43 L32 46 M27.5 48 Q32 50.5 36.5 48" fill="none"/>
    <!-- claw marks -->
    <path d="M47 41 L52 46 M44 44 L49 49" fill="none" stroke="#fbbf24" stroke-width="1.6"/>
  </g>
</svg>
